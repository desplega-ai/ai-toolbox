<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>File Review</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div id="app">
    <div id="toolbar">
      <div id="toolbar-left">
        <button id="open-file-btn" class="toolbar-btn" type="button" title="Open file (⌘O)">
          <span class="icon" data-icon="folder"></span> Open File
        </button>
        <div id="file-name" class="file-name" style="display: none;">
          <span class="icon" data-icon="file"></span>
          <span class="name"></span>
        </div>
        <button id="add-comment-btn" type="button" style="display: none;" title="Comment line (⌘K)">
          <span class="icon" data-icon="message-square"></span>
          <span class="label">Comment</span>
          <kbd class="shortcut">⌘K</kbd>
        </button>
      </div>
      <div id="toolbar-right">
        <span id="version-badge" class="version-badge"></span>
        <div id="markdown-toggle" class="segmented" role="group" aria-label="View mode" title="Toggle view (⌘M)" style="display: none;">
          <button type="button" class="segment" data-view="preview" aria-pressed="true">Preview</button>
          <button type="button" class="segment" data-view="source" aria-pressed="false">Source</button>
        </div>
        <button id="vim-toggle" class="toolbar-btn toggle-chip" type="button" aria-pressed="false" title="Toggle Vim mode (⌘⇧V)">Vim</button>
        <button id="theme-toggle" class="toolbar-btn icon-btn" type="button" aria-label="Toggle theme" title="Toggle theme (⌘⇧T)">
          <span class="icon" data-icon="moon"></span>
        </button>
        <button id="help-btn" class="toolbar-btn icon-btn" type="button" aria-label="Keyboard shortcuts" title="Shortcuts (⌘/)">
          <span class="icon" data-icon="help-circle"></span>
        </button>
      </div>
    </div>
    <div id="tab-strip-row" class="tab-strip-row">
      <div id="tab-strip" class="tab-strip" role="tablist"></div>
      <button id="closed-files-btn" class="closed-files-btn" type="button" title="Closed files in this review session" aria-label="Closed files" hidden>
        <span class="icon" data-icon="file"></span>
        <span id="closed-files-count" class="closed-files-count">0</span>
      </button>
    </div>
    <div id="closed-files-popover" class="closed-files-popover" hidden></div>
    <div id="main-container">
      <aside id="left-rail" class="rail rail-left" hidden>
        <div class="rail-panel">
          <div class="rail-header">
            <div class="rail-tabs" role="tablist" aria-label="Document panels">
              <button id="rail-tab-outline" class="rail-tab" type="button" role="tab" aria-selected="true" aria-controls="outline-panel">
                <span class="icon" data-icon="list-tree"></span>
                <span>Outline</span>
              </button>
            </div>
            <div class="rail-header-actions">
              <button id="toc-search-btn" class="rail-icon-btn" type="button" aria-label="Filter headings" title="Filter headings"><span class="icon" data-icon="search"></span></button>
              <button class="rail-icon-btn" type="button" data-rail-toggle="left" aria-label="Hide outline" title="Hide outline (⌘B)"><span class="icon" data-icon="panel-left"></span></button>
            </div>
          </div>
          <div id="outline-panel" class="rail-tabpanel" role="tabpanel" aria-labelledby="rail-tab-outline">
            <div id="toc-search-container" style="display: none;">
              <input id="toc-search-input" class="toc-search-input" type="text" placeholder="Filter headings..." />
            </div>
            <div id="toc-list"></div>
          </div>
        </div>
        <div class="rail-strip">
          <button class="rail-icon-btn" type="button" data-rail-toggle="left" aria-label="Show outline" title="Show outline (⌘B)"><span class="icon" data-icon="list-tree"></span></button>
        </div>
      </aside>
      <div id="left-rail-resizer" class="rail-resizer" role="separator" aria-orientation="vertical" aria-controls="left-rail" aria-label="Resize outline" tabindex="0" hidden></div>
      <div id="editor-container"></div>
      <div id="preview-wrapper" style="display: none;">
        <div id="preview-search-bar" style="display: none;">
          <input id="preview-search-input" type="text" placeholder="Search..." />
          <span id="preview-search-count"></span>
          <button id="preview-search-prev" class="preview-search-nav" title="Previous (Shift+Enter)">&#x25B2;</button>
          <button id="preview-search-next" class="preview-search-nav" title="Next (Enter)">&#x25BC;</button>
          <button id="preview-search-close" class="preview-search-nav" title="Close (Esc)">&times;</button>
        </div>
        <button id="reading-width-btn" class="reading-width-btn" type="button" aria-label="Toggle reading width"><span class="icon"></span></button>
        <div id="preview-container"></div>
      </div>
      <div id="right-rail-resizer" class="rail-resizer" role="separator" aria-orientation="vertical" aria-controls="sidebar" aria-label="Resize comments" tabindex="0"></div>
      <aside id="sidebar" class="rail rail-right">
        <div id="sidebar-comments-panel" class="rail-panel">
          <div id="sidebar-header" class="rail-header">
            <span class="rail-title">Comments</span>
            <div class="rail-header-actions">
              <button class="rail-icon-btn" type="button" data-rail-toggle="right" aria-label="Hide comments" title="Hide comments (⌘⌥B)"><span class="icon" data-icon="panel-right"></span></button>
            </div>
          </div>

          <!-- Comment input area (hidden by default) -->
          <div id="comment-input-area" style="display: none;">
            <div class="input-header">
              <span id="comment-line-label">Line 0</span>
            </div>
            <textarea
              id="comment-textarea"
              placeholder="Enter your comment... (⌘↵ to submit)"
              rows="4"
            ></textarea>
            <div class="input-actions">
              <button id="comment-cancel-btn" class="cancel-btn">Cancel</button>
              <button id="comment-submit-btn" class="submit-btn">Add Comment</button>
            </div>
          </div>

          <div id="comments-list"></div>
        </div>
        <div class="rail-strip">
          <button class="rail-icon-btn" type="button" data-rail-toggle="right" aria-label="Show comments" title="Show comments (⌘⌥B)"><span class="icon" data-icon="message-square"></span></button>
          <span id="comments-rail-count" class="rail-count" hidden>0</span>
        </div>
      </aside>
    </div>

    <!-- Empty state when no file is open -->
    <div id="empty-state" style="display: none;">
      <div class="empty-content">
        <div class="empty-icon" data-icon="file"></div>
        <h2>No file open</h2>
        <p>Open a markdown file to start reviewing</p>
        <button id="empty-open-btn" class="primary-btn">Open File</button>
        <div class="shortcut-hint">or press ⌘O</div>
      </div>
    </div>
  </div>
  <div id="toast-container" aria-live="polite"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
